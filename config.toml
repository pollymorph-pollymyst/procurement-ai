["источник"]
# Папка, куда учётная система (1С, МойСклад…) кладёт выгрузки. Пусто — папка «Входящие» рядом с программой.
# Меняется в дашборде: «Управление» → «Откуда берутся данные».
"папка" = ""

["мойсклад"]
# Загрузка из МойСклад по API перед каждым пересчётом. Токен — только в .env (MOYSKLAD_TOKEN) или в секретах GitHub.
# Меняется в дашборде: «Управление» → «Откуда берутся данные».
