# Настройки системы планирования закупок.
# Менять можно в любом текстовом редакторе. После изменения запустите «Обновить анализ».

["установка"]
# "нет" — при открытии дашборда покажется первая настройка: кто пишет комментарий, где выгрузки, первый расчёт.
"пройдена" = "нет"

["анализ"]
# Дата, на которую считается анализ. "авто" = по последней выгрузке
# (последний неполный месяц продаж + день из поля ниже).
"дата_анализа" = "авто"
# День месяца, по который выгружен последний неполный месяц (из README выгрузки).
"день_выгрузки" = 13
# На сколько месяцев вперёд строить прогноз и календарь закупок.
"горизонт_месяцев" = 18

["закупка"]
# Товары с наценкой ниже порога не заказываются автоматически (%, к закупочной цене).
"минимальная_наценка" = 25
# Срок поставки, если у поставщика нет истории (дни).
"срок_поставки_по_умолчанию" = 123
# Срок поставки для местных поставщиков (дни).
"срок_поставки_местный" = 30
# Пределы срока поставки (дни): реальные данные обрезаются в эти границы.
"срок_поставки_мин" = 30
"срок_поставки_макс" = 180
# Как часто заказываем у одного поставщика (дни): берётся из истории приходов в этих пределах.
"цикл_заказа_мин" = 30
"цикл_заказа_макс" = 90
# Заказ в пути, просроченный больше чем на столько дней, не учитывается в запасе.
"просрочка_сомнительного_заказа" = 60
# Через сколько дней ожидаем просроченный (но не сомнительный) заказ.
"ожидание_просроченного" = 21
# Заказ в пути ждём не целиком, а в той доле, которую поставщик обычно довозит (по закрытым заказам).
"учитывать_недовоз" = "да"   # да / нет
# Даже у самого ненадёжного поставщика ждём не меньше этой доли заказа.
"недовоз_не_ниже" = 0.3
# Запас больше чем на столько месяцев прогноза — избыток.
"избыток_месяцев" = 12
# Шаг округления заказа, если в истории заказов товара нет круглых количеств.
"шаг_округления_по_умолчанию" = 10
# Товар, который продаётся реже, чем столько штук в год, не держим на складе — заказываем под клиента.
"редкий_спрос_шт_в_год" = 12

["сервис"]
# Вероятность не уйти в дефицит за цикл, по важности товара.
A = 0.95
B = 0.90
C = 0.85
# Доля объёма продаж, которая относит товар к классу A и A+B.
"граница_A" = 0.80
"граница_B" = 0.95
# Дополнительная неуверенность в уровне спроса (доля), закладывается в страховой запас.
"неуверенность_уровня" = 0.10
# страховой запас не больше этой доли спроса на ближайший цикл заказа (защита от шумной истории и залёживания после сезона)
"страховой_запас_макс_доля" = 0.5

["прогноз"]
# Сколько последних месяцев берём для оценки уровня спроса.
"окно_уровня_месяцев" = 12
# Насколько учитывать рост/падение год к году (0 = не учитывать, 1 = полностью).
"сила_тренда" = 0.5
# Пределы годового тренда.
"тренд_мин" = 0.6
"тренд_макс" = 1.5
# Минимум месяцев истории, чтобы прогноз считался надёжным.
"мало_истории_месяцев" = 6

["комментарий"]
# Кто пишет «Комментарий аналитика». Выбирается при первом запуске и в «Управлении» → «Комментарий аналитика».
# "сервис": "" — ещё не выбран; "claude", "openai" (ChatGPT, DeepSeek, YandexGPT…), "gigachat", "local" (Ollama,
# LM Studio на этом компьютере), "нет" — по шаблону. Ключи хранятся в .env, не здесь.
# На расчёт выбор не влияет: сервис пишет только текст, числа в нём сверяются с расчётом.
# "адрес" и "модель" пустые — значит, по умолчанию для выбранного сервиса (у каждого своя версия).
"сервис" = ""
"адрес" = ""
"модель" = ""
"доступ" = "GIGACHAT_API_PERS"
"режим" = "авто"

["праздники"]
# Пока фабрики стоят на праздниках, заказ не производится — срок поставки удлиняется.
# Даты, простой и страны меняются в дашборде: «Управление» → «Праздники у поставщиков».
"учитывать" = "да"   # да / нет — выключить все праздники разом

["страна поставщика"]
# Чьи праздники учитывать. По типу поставки — и отдельно по любому поставщику: "SUP-9D84EE" = "Индия".
"импорт" = "Китай"
"местный" = "Россия"

