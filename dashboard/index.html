<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Закупки — что заказать сегодня</title>
<meta name="description" content="План закупок: что, сколько и когда заказать у каждого поставщика.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' fill='%23f6f6f4' stroke='%23161716' stroke-width='2'/%3E%3Crect x='3' y='5' width='26' height='7' fill='%23c42a1f'/%3E%3Ctext x='16' y='26' font-family='Arial' font-weight='700' font-size='13' text-anchor='middle' fill='%23161716'%3E13%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ground:#eceeec; --leaf:#fafaf8; --leaf-2:#f3f4f2; --ink:#161716; --ink-2:#4f5351; --ink-3:#5f6461;
  --rule:#cdd1ce; --rule-strong:#9aa09c; --red:#c42a1f; --red-ink:#a3221a; --red-wash:#f8e3e0;
  --amber:#8a5700; --amber-wash:#fbefd5; --green:#1d7a35; --green-wash:#e2f1e5; --orange:#9a4115; --orange-wash:#f9e6dc;
  --blue:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4; --series-6:#6250d6;
  --focus:#2a78d6; --shadow:0 1px 0 rgba(22,23,22,.06),0 6px 18px -10px rgba(22,23,22,.22);
  --num:"Oswald","Arial Narrow",system-ui,sans-serif; --sans:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#121312; --leaf:#1b1d1c; --leaf-2:#222524; --ink:#ecedea; --ink-2:#b5bab7; --ink-3:#8d9390;
  --rule:#323634; --rule-strong:#545a57; --red:#ef5a4b; --red-ink:#ff8476; --red-wash:#3a1d1a;
  --amber:#e8a73a; --amber-wash:#352a14; --green:#4cc06a; --green-wash:#16301d; --orange:#ec8a5a; --orange-wash:#37231a;
  --blue:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#9085e9;
  --focus:#6aa7f0; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#121312; --leaf:#1b1d1c; --leaf-2:#222524; --ink:#ecedea; --ink-2:#b5bab7; --ink-3:#8d9390;
  --rule:#323634; --rule-strong:#545a57; --red:#ef5a4b; --red-ink:#ff8476; --red-wash:#3a1d1a;
  --amber:#e8a73a; --amber-wash:#352a14; --green:#4cc06a; --green-wash:#16301d; --orange:#ec8a5a; --orange-wash:#37231a;
  --blue:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#9085e9;
  --focus:#6aa7f0; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
::selection{background:var(--red);color:#fff}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.num{font-family:var(--num);font-weight:500;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{border-bottom:1px solid var(--rule);background:var(--ground)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:56px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:14px;height:16px;border:1.5px solid var(--ink);border-top:5px solid var(--red)}
.iconbtn{border:1px solid var(--rule-strong);background:transparent;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;border-radius:2px}
.iconbtn:hover{background:var(--leaf)}
.iconbtn svg{width:18px;height:18px}

/* today */
.today{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:32px;padding:24px 0 0}
.leaf-stack{position:relative;align-self:start;margin-bottom:10px}
.leaf-stack::before,.leaf-stack::after{content:"";position:absolute;height:8px;background:var(--leaf-2);box-shadow:var(--shadow)}
.leaf-stack::before{left:6px;right:6px;bottom:-5px;z-index:0}
.leaf-stack::after{left:12px;right:12px;bottom:-10px;z-index:-1}
.leaf{background:var(--leaf);box-shadow:var(--shadow);position:relative;z-index:1;padding:26px 22px 22px;text-align:center}
.leaf::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--red)}
.leaf::after{content:"";position:absolute;left:10px;right:10px;top:16px;border-top:2px dotted var(--rule-strong)}
.leaf-week{margin-top:12px;text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:600;color:var(--ink-2)}
.leaf-day{font-family:var(--num);font-weight:600;font-size:132px;line-height:.95;letter-spacing:-.02em;color:var(--red);margin:6px 0 2px}
.leaf-month{font-family:var(--num);font-size:24px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.leaf-foot{border-top:1px solid var(--rule);margin-top:16px;padding-top:12px;font-size:14px;color:var(--ink-2);text-align:left}
.headline{font-size:clamp(24px,2.4vw,32px);line-height:1.2;font-weight:600;letter-spacing:-.015em;margin:4px 0 16px;text-wrap:balance;max-width:28ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--leaf);color:var(--ink);padding:9px 14px;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;border-radius:2px;white-space:nowrap;transition:background .15s,color .15s}
.btn:hover{background:var(--ink);color:var(--leaf)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-ink);border-color:var(--red-ink)}
.btn.ghost{border-color:var(--rule-strong);background:transparent;font-weight:500}
.btn.ghost:hover{background:var(--leaf);color:var(--ink)}
.btn svg{width:16px;height:16px;flex:none}
.margins{display:grid;grid-template-columns:repeat(3,1fr);margin:0;border-top:2px solid var(--ink)}
.margins button{all:unset;cursor:pointer;padding:14px 16px 14px 0;border-right:1px solid var(--rule);display:flex;flex-wrap:wrap;align-items:baseline;align-content:flex-start;gap:2px 8px}
.margins button + button{padding-left:16px}
.margins button:last-child{border-right:0}
.margins button:hover .m-label{text-decoration:underline}
.margins button:focus-visible{outline:2px solid var(--focus)}
.m-num{font-family:var(--num);font-weight:500;font-size:28px;line-height:1}
.m-num small{font-size:20px;color:var(--ink-2);margin-left:4px}
.m-label{font-weight:600;display:flex;align-items:center;gap:6px}
.m-hint{font-size:14px;color:var(--ink-2);flex-basis:100%}
.m-red .m-num{color:var(--red)}
.m-label svg{width:15px;height:15px;flex:none}

/* commentary */
.comment{margin:28px 0 8px;background:var(--leaf);padding:20px 22px;display:grid;grid-template-columns:200px 1fr 1fr 1fr;gap:24px;border-top:1px solid var(--rule)}
.comment h2{font-size:15px;margin:0;font-weight:700}
.comment h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin:0 0 8px;font-weight:600}
.comment ul{margin:0;padding:0;list-style:none}
.comment li{padding:6px 0;border-top:1px solid var(--rule);font-size:14px;line-height:1.45}
.comment li:first-child{border-top:0;padding-top:0}
.comment .note{font-size:13px;color:var(--ink-3);margin-top:8px}

/* sections */
section.block{margin-top:40px}
.sec-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:0}
.sec-head h2{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.sec-head p{margin:0;color:var(--ink-2);font-size:14px}
.sec-head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* supplier rows */
.sup{border-bottom:1px solid var(--rule);background:transparent}
.sup-row{display:grid;grid-template-columns:minmax(170px,1.4fr) 90px 110px 150px 120px auto 40px;gap:16px;align-items:center;padding:14px 0}
.sup-name{font-weight:700;font-size:16px}
.sup-sub{font-size:14px;color:var(--ink-2)}
.cell-k{font-size:13px;color:var(--ink-3);display:block}
.cell-v{font-family:var(--num);font-size:22px;font-weight:500;line-height:1.1}
.cell-v.red{color:var(--red)}
.date-leaf{display:inline-grid;grid-template-columns:auto auto;align-items:center;gap:8px}
.date-leaf b{font-family:var(--num);font-weight:600;font-size:26px;line-height:1;border-top:4px solid var(--red);background:var(--leaf);padding:3px 6px 2px;min-width:40px;text-align:center;box-shadow:var(--shadow)}
.date-leaf span{font-size:14px;line-height:1.2;color:var(--ink-2)}
.toggle{width:36px;height:36px;border:1px solid var(--rule-strong);background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:2px}
.toggle:hover{background:var(--leaf)}
.toggle svg{width:16px;height:16px;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.sup.open .toggle svg{transform:rotate(180deg)}
.sup-lines{display:none;padding:0 0 18px}
.sup.open .sup-lines{display:block}
.more-row{padding:14px 0;color:var(--ink-2);font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);background:var(--leaf)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;font-size:13px;color:var(--ink-2);background:var(--leaf-2);position:sticky;top:0;z-index:1;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th[aria-sort="ascending"]::after{content:" ↑"}
th[aria-sort="descending"]::after{content:" ↓"}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--leaf-2)}
td .why{color:var(--ink-2);font-size:14px;max-width:62ch}
.sku{font-weight:600;white-space:nowrap}
.linkbtn{all:unset;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.linkbtn:focus-visible{outline:2px solid var(--focus)}
.linkbtn.sku,td.id{white-space:nowrap}
td .why{min-width:440px}

/* status chips */
.st{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;white-space:nowrap;padding:1px 7px 1px 5px;border-radius:2px}
.st svg{width:14px;height:14px;flex:none}
.st.critical{color:var(--red-ink);background:var(--red-wash)}
.st.warning{color:var(--amber);background:var(--amber-wash)}
.st.serious{color:var(--orange);background:var(--orange-wash)}
.st.good{color:var(--green);background:var(--green-wash)}
.st.neutral{color:var(--ink-2);background:var(--leaf-2)}
.flag{display:inline-flex;gap:5px;align-items:flex-start;font-size:14px;color:var(--orange);margin:2px 12px 0 0}
.flag svg{width:14px;height:14px;flex:none;margin-top:2px}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule-strong);overflow-x:auto;scrollbar-width:none;margin-top:48px;position:sticky;top:0;background:var(--ground);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;padding:14px 16px 12px;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.tabs button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.tabs .cnt{font-family:var(--num);font-weight:500;font-size:13px;color:var(--ink-3)}
.panel{padding:24px 0 64px}
.panel[hidden]{display:none}
.panel h3{font-size:18px;margin:28px 0 10px;font-weight:700}
.panel h3:first-child{margin-top:0}
.panel p.lead{margin:0 0 16px;color:var(--ink-2);max-width:72ch}

/* calendar of leaves (signature) */
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:14px 12px;margin-top:8px}
.mleaf{all:unset;cursor:pointer;background:var(--leaf);box-shadow:var(--shadow);position:relative;padding:24px 12px 12px;display:flex;flex-direction:column;min-height:132px;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.mleaf::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--ink)}
.mleaf.now::before{background:var(--red)}
.mleaf::after{content:"";position:absolute;left:8px;right:8px;top:12px;border-top:2px dotted var(--rule-strong)}
.mleaf.empty::after{display:none}
.mleaf.empty{background:transparent;box-shadow:none;border:1px dashed var(--rule-strong);cursor:default}
.mleaf.empty::before{display:none}
.mleaf:not(.empty):hover{transform:translateY(-3px)}
.mleaf[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.mleaf:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ml-m{font-size:13px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--ink-2)}
.ml-q{font-family:var(--num);font-weight:600;font-size:34px;line-height:1.05;margin-top:6px}
.ml-s{font-size:13px;color:var(--ink-2);margin-top:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2);margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;display:inline-block;border-radius:1px}
.legend i.line{height:3px}
.legend i.dash{height:0;border-top:2px dashed currentColor;width:14px}

/* segmented list chooser */
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.seg button{border:1px solid var(--rule-strong);background:transparent;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center;border-radius:2px}
.seg button:hover{background:var(--leaf)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--leaf);border-color:var(--ink)}
.seg button .num{font-size:15px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.filters input,.filters select{border:1px solid var(--rule-strong);background:var(--leaf);padding:8px 10px;min-height:38px;border-radius:2px}
.filters input{min-width:240px;flex:1;max-width:360px}
.filters .count{margin-left:auto;color:var(--ink-2);font-size:14px}
.empty-state{padding:32px;text-align:center;color:var(--ink-2);background:var(--leaf);border:1px dashed var(--rule-strong)}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--ink-3);font:12px var(--sans)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--leaf);font-size:13px;padding:8px 10px;z-index:50;min-width:140px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;border-radius:2px}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tip i{width:9px;height:9px;display:inline-block;margin-right:6px}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.cat{background:var(--leaf);padding:16px;border-top:3px solid var(--ink)}
.cat h4{margin:0;font-size:16px}
.cat .sub{font-size:13px;color:var(--ink-2);margin:2px 0 8px}
.score{display:grid;grid-template-columns:repeat(3,auto);gap:4px 28px;justify-content:start;background:var(--leaf);padding:16px 20px;margin-bottom:20px}
.score .num{font-size:36px;line-height:1}
@media (max-width:640px){.score{grid-template-columns:auto auto}.score>:nth-child(3){grid-column:1/-1}}

/* item dialog */
dialog.card{border:0;padding:0;margin:0 0 0 auto;height:100%;max-height:100%;width:min(760px,100%);background:var(--ground);color:var(--ink);box-shadow:var(--shadow)}
dialog.card{scroll-padding-top:100px;scroll-padding-bottom:80px}  /* фокус и прокрутка не уходят под липкую шапку и нижнюю панель */
dialog.card::backdrop{background:rgba(10,12,11,.45)}
dialog.card[open]{animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.card-head{position:sticky;top:0;background:var(--ground);padding:18px 24px 12px;border-bottom:2px solid var(--ink);display:flex;gap:12px;align-items:flex-start;z-index:2}
.card-head h2{margin:0;font-size:22px}
.card-head .close{margin-left:auto}
.card-body{padding:18px 24px 40px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--rule);margin:16px 0}
.facts div{padding:10px 12px 10px 0;border-bottom:1px solid var(--rule)}
.facts dt{font-size:13px;color:var(--ink-3)}
.facts dd{margin:0;font-family:var(--num);font-size:20px;font-weight:500}
.reason{font-size:15px;line-height:1.55;background:var(--leaf);padding:14px 16px;margin:12px 0;max-width:70ch}
.card-body h3{font-size:15px;margin:22px 0 6px}

details.method{background:var(--leaf);padding:0 20px;border-top:1px solid var(--rule)}
details.method summary{cursor:pointer;padding:16px 0;font-weight:600}
details.method[open] summary{border-bottom:1px solid var(--rule)}
.method-body{max-width:76ch;padding:8px 0 20px}
.method-body h4{margin:18px 0 4px;font-size:15px}
.method-body p{margin:4px 0}

/* status + control panel */
.ctl-open{all:unset;cursor:pointer;margin-left:auto;display:flex;align-items:center;gap:12px;padding:6px 10px 6px 12px;border:1px solid var(--rule-strong);border-radius:2px;min-height:44px;box-sizing:border-box}
.ctl-open:hover{background:var(--leaf)}
.ctl-open:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ctl-open .st-text{font-size:13px;line-height:1.35;color:var(--ink-2);text-align:right}
.ctl-open .st-text b{color:var(--ink);font-weight:600}
.ctl-open .gear{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--ink);border-left:1px solid var(--rule);padding-left:12px;align-self:stretch}
.ctl-open svg{width:18px;height:18px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--green)}
.dot.bad{background:var(--orange)}
.dot.run{background:var(--blue);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.35}}
[hidden]{display:none!important}
.stale-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--amber-wash);border:1px solid var(--amber);padding:12px 16px;margin-top:20px;font-size:15px}
.stale-bar>svg{width:20px;height:20px;flex:none;color:var(--amber)}
.stale-bar>div{flex:1;min-width:240px}
.leaf.stale::before{background:var(--ink-2)}
.leaf.stale .leaf-day{color:var(--ink)}
.c-dl{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.sup.sent .sup-row{grid-template-columns:1fr auto;padding:10px 0}
.sup.sent .sup-row .c-name{grid-column:1;grid-row:1}
.sup.sent .sup-row .c-dl{grid-column:2;grid-row:1}
.sup.sent .sup-name{color:var(--ink-2);font-weight:600}
.sent-mark{display:inline-flex;gap:6px;align-items:center;color:var(--green);font-weight:600;font-size:14px}
.sent-mark svg{width:16px;height:16px}
.sent-count{color:var(--green);font-weight:600}
.sent-left{display:flex;gap:8px;align-items:flex-start;color:var(--green);font-weight:600;margin:-6px 0 16px;max-width:52ch}
.sent-left:empty,.c-note:empty{display:none}
.sent-left svg{width:18px;height:18px;flex:none;margin-top:2px}
.c-note{grid-column:1/-1;margin:0}
.sup.sent .sent-mark+.small{display:block;flex-basis:100%;text-align:right}
.acc{margin-top:20px;border-top:1px solid var(--rule);padding-top:14px}
.acc h3{font-size:16px;margin:0 0 4px}
.acc-row{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.acc-row .linkbtn{min-height:44px}
.alt-link{font-size:14px;color:var(--ink-2)}
.seg .more{border-style:dashed}
.ctl-sec{padding:22px 0;border-bottom:1px solid var(--rule)}
.ctl-sec:last-child{border-bottom:0}
.ctl-sec h3{font-size:18px;margin:0 0 6px;font-weight:700}
.ctl-sec>.lead{color:var(--ink-2);font-size:14px;margin:0 0 14px;max-width:62ch}
.ctl-sec h4{font-size:15px;margin:22px 0 2px;font-weight:700}
.mode{background:var(--leaf);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;margin-top:16px;max-width:66ch}
.mode svg{width:18px;height:18px;flex:none;margin-top:1px}
.runline{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;font-size:15px}
.runline svg{width:18px;height:18px;flex:none;margin-top:2px}
.runline .okc{color:var(--green)}
.runline .badc{color:var(--orange)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn[disabled],.btn.primary[disabled]{background:var(--leaf-2);border-color:var(--rule-strong);color:var(--ink-2);opacity:.75;cursor:not-allowed;pointer-events:none}
.log{font-size:13px;line-height:1.5;background:var(--leaf);border:1px solid var(--rule);padding:10px 12px;max-height:180px;overflow:auto;margin-top:12px;white-space:pre-wrap}
.err{background:var(--orange-wash);border:1px solid var(--orange);padding:10px 12px;font-size:14px;margin:12px 0;max-width:66ch}
.okmsg{color:var(--green);font-weight:600;font-size:14px}
.sw{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:12px;font-weight:600;font-size:15px;min-height:44px}
.sw i{width:44px;height:24px;border:1px solid var(--ink);background:var(--leaf-2);position:relative;border-radius:2px;flex:none;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--ink-2);transition:transform .18s cubic-bezier(.2,.8,.2,1),background .15s}
.sw[aria-checked="true"] i{background:var(--ink)}
.sw[aria-checked="true"] i::after{transform:translateX(20px);background:var(--leaf)}
.sw:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sch-grid{display:grid;grid-template-columns:auto 1fr;gap:14px 20px;align-items:center;margin:14px 0}
.sch-grid>label,.sch-grid>.lbl{font-weight:600;font-size:15px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{all:unset;cursor:pointer;min-width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--rule-strong);font-weight:600;font-size:14px;border-radius:2px;box-sizing:border-box}
.days button:hover{background:var(--leaf)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--leaf);border-color:var(--ink)}
.days button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.quick{display:flex;gap:16px;font-size:14px;margin-top:8px}
.tinput{border:1px solid var(--rule-strong);background:var(--leaf);padding:6px 10px;min-height:44px;border-radius:2px;font-family:var(--num);font-size:20px;box-sizing:border-box}
.sum{font-size:15px;margin:6px 0 0}
.field{display:grid;grid-template-columns:1fr 170px;gap:4px 20px;padding:14px 0;border-top:1px solid var(--rule);align-items:start}
.field label{font-weight:600;font-size:15px}
.field .help{grid-column:1;font-size:14px;color:var(--ink-2);max-width:52ch;margin:0}
.field .inp{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.field.wide{grid-template-columns:1fr}
.field.wide .inp{grid-column:1;grid-row:auto;align-items:flex-start}
.ibox{display:flex;align-items:center;border:1px solid var(--rule-strong);background:var(--leaf);border-radius:2px;min-height:44px}
.ibox:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.ibox input,.ibox select{border:0;background:transparent;padding:8px 10px;outline:0}
.ibox input[type=number]{width:96px;text-align:right;font-family:var(--num);font-size:19px}
.ibox input[type=text]{width:220px}
.ibox span{padding-right:10px;color:var(--ink-2);font-size:14px;white-space:nowrap}
.field .dflt{font-size:13px;color:var(--ink-2)}
.field .dflt button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.field.changed .ibox{border-color:var(--ink)}
.field.hol{grid-template-columns:1fr auto}
.field.hol .help{margin-top:4px}
.field.hol .inp{flex-direction:row;flex-wrap:wrap;gap:8px}
.field.hol .ibox input[type=number]{width:56px}
.field.hol .ibox span:first-child{padding:0 0 0 10px}
details.adv{margin-top:22px;border-top:2px solid var(--ink)}
details.adv>summary{cursor:pointer;padding:14px 0;font-weight:700;font-size:16px}
details.adv>.lead{color:var(--ink-2);font-size:14px;margin:0 0 6px}
fieldset.ro{border:0;padding:0;margin:0;min-width:0}
.ctl-save{position:sticky;bottom:0;background:var(--ground);border-top:2px solid var(--ink);padding:12px 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;z-index:2}
.ctl-save .msg{font-size:14px;color:var(--ink-2)}

.ctl-save[hidden]{display:none}
.msg.bad{color:var(--orange);font-weight:600}
.okc{color:var(--green)}
.badc{color:var(--orange)}
.okc svg,.badc svg{width:18px;height:18px;vertical-align:-4px}
#sch-body.off{opacity:.5}
.path{display:inline-block;font-size:14px;word-break:break-all;background:var(--leaf);border:1px solid var(--rule);padding:6px 10px}
.mapbox{background:var(--leaf);padding:4px 16px 16px;margin-top:16px;border:1px solid var(--orange)}
.mapbox .field{border-top-color:var(--rule)}
.svc-list{display:grid;gap:8px;margin:4px 0 8px}
.svc{display:grid;grid-template-columns:22px 1fr;gap:2px 10px;align-items:start;padding:12px 14px;border:1px solid var(--rule-strong);background:var(--leaf);border-radius:2px;cursor:pointer}
.svc:hover{border-color:var(--ink-2)}
.svc:has(input:checked){border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.svc:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:1px}
.svc input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--ink)}
.svc b{font-size:15px}
.svc .small{grid-column:2}
.wr-det{padding:0 14px 6px;border:1px solid var(--ink);border-top:0;margin-top:-9px;background:var(--leaf)}
.wr-det .field:first-child{border-top:0}
.wr-det .field{grid-template-columns:minmax(0,1fr) minmax(0,260px)}
.wr-det .ibox,.wr-det .ibox input,.wr-det .ibox select{width:100%;min-width:0;box-sizing:border-box}
.wr-det .field .inp{align-items:stretch;min-width:0}
.wr-now{font-size:14px;margin:0 0 12px;max-width:66ch}
dialog.setup{border:0;padding:0;width:min(680px,calc(100% - 32px));max-height:calc(100% - 32px);background:var(--ground);color:var(--ink);box-shadow:var(--shadow)}
dialog.setup::backdrop{background:rgba(10,12,11,.55)}
dialog.setup .card-body{padding:24px}
dialog.setup h2{margin:0 0 8px;font-size:24px}
dialog.setup .lead{color:var(--ink-2);margin:0 0 16px;max-width:60ch}
dialog.setup h2:focus{outline:0}
.su-steps{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 14px;font-size:13px;color:var(--ink-2)}
.su-steps .on{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.su-steps .done{color:var(--green)}
.su-note{font-size:14px;margin:12px 0 8px;max-width:62ch}
.su-nav{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule)}

footer{border-top:1px solid var(--rule);padding:20px 0 40px;color:var(--ink-2);font-size:14px}

@media (max-width:1060px){
  .comment{grid-template-columns:1fr 1fr}
  .comment h2{grid-column:1/-1}
  .months{grid-template-columns:repeat(4,1fr)}
  .sup-row{grid-template-columns:1fr 70px 90px 110px 100px auto 36px}
}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .today{grid-template-columns:1fr;gap:20px;padding-top:20px}
  .leaf{display:grid;grid-template-columns:auto 1fr;text-align:left;gap:0 16px;align-items:center;padding:22px 16px 14px}
  .leaf-week{grid-column:2;margin:0;align-self:end}
  .leaf-day{grid-row:1/3;font-size:84px;margin:0}
  .leaf-month{grid-column:2;align-self:start;font-size:20px}
  .leaf-foot{display:none}
  .leaf{padding:18px 16px 10px}
  .leaf-day{font-size:60px}
  .leaf-stack{margin-bottom:4px}
  .margins{grid-template-columns:1fr}
  .margins button,.margins button + button{padding:10px 0;border-right:0;border-bottom:1px solid var(--rule)}
  .m-num{font-size:24px}
  .m-hint{flex-basis:auto}
  .cta [data-go="calendar"]{display:none}
  .comment{grid-template-columns:1fr;padding:16px}
  .sup-row{grid-template-columns:repeat(3,1fr) auto;gap:8px 12px}
  .sup-row .c-name{grid-column:1/4;grid-row:1}
  .sup-row .c-tg{grid-column:4;grid-row:1}
  .sup-row .c-sk,.sup-row .c-q,.sup-row .c-def,.sup-row .c-arr{grid-row:2;text-align:left;align-self:end}
  .sup-row .c-dl{grid-column:1/-1;grid-row:3}
  .months{grid-template-columns:repeat(2,1fr)}
  .cats{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}
  .filters input{min-width:0;max-width:none;width:100%}
  .tabs{flex-wrap:wrap;position:static;overflow:visible}
  .tabs button{padding:10px 12px 8px;min-height:44px;box-sizing:border-box}
  .iconbtn,.toggle{width:44px;height:44px}
  .btn{min-height:44px}
  .seg button{min-height:44px}
  .ctl-open .st-text{display:none}
  .ctl-open .gear{border-left:0;padding-left:0}
  .field,.field.hol{grid-template-columns:1fr}
  .wr-det .field{grid-template-columns:1fr}
  .field .inp{grid-column:1;grid-row:auto;align-items:flex-start}
  .sch-grid{grid-template-columns:1fr;gap:8px}
  .card-head,.card-body,.ctl-save{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.tabs,.top button,.toggle,.cta{display:none}body{background:#fff}}

<body>
<header class="top"><div class="wrap">
  <div class="brand"><i aria-hidden="true"></i>Закупки</div>
  <button class="ctl-open" id="ctl-open" type="button" aria-haspopup="dialog"></button>
  <button class="iconbtn" id="theme" type="button" aria-label="Переключить светлую или тёмную тему"></button>
</div></header>

<main class="wrap" id="app"></main>

<dialog class="card" id="card" aria-labelledby="card-title"></dialog>
<dialog class="card" id="ctl" aria-labelledby="ctl-title"></dialog>
<dialog class="setup" id="setup" aria-labelledby="setup-title"></dialog>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script>
const DATA = /*__DATA__*/null;
</script>
<script>
(() => {
"use strict";
const D = DATA;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N = x => x == null || isNaN(x) ? "—" : Math.round(x).toLocaleString("ru-RU").replace(/ /g, " ");
const MG = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MN = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MS = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const pd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d || 1); };
const rd = s => { if (!s) return "—"; const d = pd(s); return `${d.getDate()} ${MG[d.getMonth()]} ${d.getFullYear()}`; };
const rdShort = s => { if (!s) return "—"; const d = pd(s); return `${d.getDate()} ${MS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`; };
const ym = s => { const d = pd(s); return `${MN[d.getMonth()]} ${d.getFullYear()}`; };
const ymShort = s => { const d = pd(s); return `${MS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`; };
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const k = n % 10; if (n > 10 && n < 20) return c; if (k > 1 && k < 5) return b; if (k === 1) return a; return c; };
const tov = n => `${N(n)} ${plural(n, "товар", "товара", "товаров")}`;

/* ---------- icons (one stroke family) ---------- */
const I = {
  download: '<path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/>',
  alert: '<path d="M12 4 2.8 19.5h18.4L12 4Z"/><path d="M12 10v4.5M12 17v.2"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  check: '<circle cx="12" cy="12" r="8.5"/><path d="m8 12.2 2.7 2.7L16.2 9.4"/>',
  box: '<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5v-9Z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>',
  empty: '<circle cx="12" cy="12" r="8.5"/><path d="M6 18 18 6"/>',
  tag: '<path d="M3.5 12.5V4h8.5l8.5 8.5-8.5 8.5-8.5-8.5Z"/><circle cx="8.2" cy="8.2" r="1.3"/>',
  user: '<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  layers: '<path d="m12 4 8.5 4.5L12 13 3.5 8.5 12 4Z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5"/>',
  minus: '<circle cx="12" cy="12" r="8.5"/><path d="M8 12h8"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
  moon: '<path d="M19.5 14.5A8 8 0 1 1 9.5 4.5a6.5 6.5 0 0 0 10 10Z"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  refresh: '<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.6 4.2v4.3h-4.3"/>',
  folder: '<path d="M3.5 6h6l2 2.2h9V19h-17z"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v6H4V6h6"/>',
  send: '<path d="M4 12 20 4l-5 16-3.5-6.5L4 12Z"/><path d="m11.5 13.5 3-3"/>',
  truck: '<path d="M3 6.5h11v9H3zM14 9.5h3.8l3.2 3.3v2.7H14"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/>',
};
const ic = (k, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;

const ST = {
  ORDER_NOW: ["critical", "alert"], ORDER_SOON: ["warning", "clock"], NEED_SUPPLIER: ["serious", "user"],
  REVIEW_PRICE: ["serious", "tag"], RARE: ["neutral", "minus"], PLANNED: ["neutral", "calendar"],
  OK: ["good", "check"], EXCESS: ["warning", "layers"], DEAD: ["neutral", "box"], INACTIVE: ["neutral", "empty"],
};
const LABEL = Object.fromEntries(Object.entries(D.meta.statuses).map(([k, v]) => [k, v.label]));
const KEY_BY_LABEL = Object.fromEntries(Object.entries(LABEL).map(([k, v]) => [v, k]));
const chip = st => { const [c, i] = ST[st] || ["neutral", "minus"]; return `<span class="st ${c}">${ic(i)}${esc(LABEL[st] || st)}</span>`; };
const chipL = label => chip(KEY_BY_LABEL[label] || "");
const SKU = Object.fromEntries(D.skus.map(r => [r.sku_id, r]));
const fileUrl = name => name ? `orders/${encodeURIComponent(name)}` : null;
const K = D.kpi;

/* ---------- theme ---------- */
const root = document.documentElement;
const themeBtn = $("#theme");
const sysDark = () => matchMedia("(prefers-color-scheme: dark)").matches;
function applyTheme(t) {
  if (t) root.dataset.theme = t; else delete root.dataset.theme;
  const dark = t ? t === "dark" : sysDark();
  themeBtn.innerHTML = ic(dark ? "sun" : "moon");
}
let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
applyTheme(saved);
themeBtn.onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : sysDark();
  const t = dark ? "light" : "dark"; applyTheme(t); try { localStorage.setItem("theme", t); } catch (e) {}
  rerenderCharts();
};

/* ---------- header ---------- */
const rdNY = s => { const d = pd(s); return `${d.getDate()} ${MG[d.getMonth()]}`; };

/* ---------- today ---------- */
const asOf = pd(D.meta.as_of);
const C = D.commentary || {};
const files = D.files || {};
const app = $("#app");
const weekday = asOf.toLocaleDateString("ru-RU", { weekday: "long" });
const today0 = new Date(); today0.setHours(0, 0, 0, 0);
const ageDays = Math.round((today0 - asOf) / 864e5);
const STALE = ageDays > 2;
const headline = (C.headline || "").replace(/^Сегодня/, STALE ? `На ${rdNY(D.meta.as_of)}` : "Сегодня");
const nextMonth = MG[(asOf.getMonth()+5)%12].replace(/я$/,"ю").replace(/а$/,"у");

const marg = [
  { id: "deficit", red: true, num: N(K.deficit_skus), label: "Не успеем довезти", icon: "truck",
    hint: "кончатся до прихода нового заказа" },
  { id: "oos", num: N(K.out_of_stock_skus), label: "Нет на складе", icon: "empty", hint: "из тех, что продаются" },
  { id: "excess", num: N(K.excess_skus), label: "Избыток", icon: "layers", hint: `лишние ${N(K.excess_qty)} шт.` },
];

app.innerHTML = `
${STALE ? `<div class="stale-bar" id="stale-bar" role="status">${ic("clock")}<div><b>Данные устарели: выгрузка от ${rd(D.meta.as_of)}, ${N(ageDays)} ${plural(ageDays, "день", "дня", "дней")} назад.</b>
  Заказы ниже посчитаны на эту дату. Положите свежую выгрузку в папку с выгрузками и обновите анализ.</div>
  <button class="btn" type="button" data-ctl="run">${ic("refresh")}Как обновить</button></div>` : ""}
<div id="intake-bar"></div>
<section class="today" aria-labelledby="headline">
  <div class="leaf-stack"><div class="leaf ${STALE ? "stale" : ""}" aria-label="${STALE ? "Дата выгрузки" : "Сегодня"}: ${rd(D.meta.as_of)}">
    <div class="leaf-week">${esc(weekday)}</div>
    <div class="leaf-day">${asOf.getDate()}</div>
    <div class="leaf-month">${MG[asOf.getMonth()]} ${asOf.getFullYear()}</div>
    <div class="leaf-foot">${STALE ? `Расчёт на дату выгрузки. Поставка из Китая идёт 4–6 месяцев: заказ от этой даты закрывает спрос к ${nextMonth}.` : `Поставка из Китая идёт 4–6 месяцев, поэтому заказываем сегодня то, что понадобится к ${nextMonth}.`}</div>
  </div></div>
  <div>
    <h1 class="headline" id="headline">${esc(headline).replace(/(\d) (?=\d|шт\.)/g, "$1 ")}</h1>
    <p class="sent-left" id="sent-left" role="status"></p>
    <div class="cta">
      ${files._all ? `<a class="btn primary" href="${fileUrl(files._all)}" download>${ic("download")}Скачать все заказы (Excel)</a>` : ""}
      <button class="btn ghost" type="button" data-go="calendar">${ic("calendar")}Когда заказывать дальше</button>
      ${files._csv ? `<a class="alt-link" href="${fileUrl(files._csv)}" download>другой формат: CSV</a>` : ""}
    </div>
    <div class="margins">
      ${marg.map(m => `<button type="button" class="${m.red ? "m-red" : ""}" data-kpi="${m.id}">

const tip = $("#tip");
const charts = [];
function cssv(v) { const m = /^var\((--[\w-]+)\)$/.exec(v); return m ? getComputedStyle(root).getPropertyValue(m[1]).trim() : v; }
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const r = v / p; return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * p; }
/* spec: {labels, labelFmt, series:[{name, color, type:'bar'|'line', values, dash, stack}], marks?:bool[], markLabel, height, split?: index of "today"} */
function chart(el, spec) {
  const c = { el, spec }; charts.push(c); draw(c); return c;
}
function draw(c) {
  const { el, spec } = c;
  const W = Math.max(280, el.clientWidth), H = spec.height || 220, L = 44, R = 8, T = 8, B = 26;
  const n = spec.labels.length;
  const vals = spec.series.flatMap(s => s.values.filter(v => v != null));
  const mx = niceMax(Math.max(1, ...vals));
  const x0 = i => L + (W - L - R) * (i + 0.5) / n, bw = Math.max(2, (W - L - R) / n * 0.68);
  const y = v => T + (H - T - B) * (1 - v / mx);
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = mx * k / 4, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${cssv("var(--rule)")}" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${yy + 4}" text-anchor="end">${N(v)}</text>`; }
  if (spec.marks) spec.marks.forEach((m, i) => { if (m) g += `<rect x="${x0(i) - (W - L - R) / n / 2}" y="${T}" width="${(W - L - R) / n}" height="${H - T - B}" fill="${cssv("var(--red-wash)")}"/>`; });
  if (spec.split != null) { const xs = x0(spec.split) - (W - L - R) / n / 2;
    g += `<line x1="${xs}" x2="${xs}" y1="${T}" y2="${H - B}" stroke="${cssv("var(--ink)")}" stroke-dasharray="3 3"/><text x="${xs + 4}" y="${T + 12}" style="fill:${cssv("var(--ink-2)")}">сегодня</text>`; }
  spec.series.filter(s => s.type === "bar").forEach(s => s.values.forEach((v, i) => { if (v == null) return;
    g += `<rect x="${x0(i) - bw / 2}" y="${y(v)}" width="${bw}" height="${Math.max(0, y(0) - y(v))}" fill="${cssv(s.color)}" rx="1"/>`; }));
  spec.series.filter(s => s.type === "line").forEach(s => { let d = "", pen = false;
    s.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${x0(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    g += `<path d="${d}" fill="none" stroke="${cssv(s.color)}" stroke-width="2" ${s.dash ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`; });
  const every = Math.max(1, Math.ceil(n / Math.floor((W - L) / 56)));
  spec.labels.forEach((lb, i) => { if (i % every === 0) g += `<text x="${x0(i)}" y="${H - 8}" text-anchor="middle">${esc(spec.labelFmt ? spec.labelFmt(lb) : lb)}</text>`; });
  g += `<line class="hair" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="${cssv("var(--ink-3)")}" visibility="hidden"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(spec.aria || "График")}">${g}</svg>`;
  const svg = $("svg", el), hair = $(".hair", el);
  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * W / r.width;
    const i = Math.min(n - 1, Math.max(0, Math.floor((px - L) / ((W - L - R) / n)))); const xi = x0(i);
    hair.setAttribute("x1", xi); hair.setAttribute("x2", xi); hair.setAttribute("visibility", "visible");
    const rows = spec.series.map(s => s.values[i] == null ? "" : `<div><span><i style="background:${cssv(s.color)}"></i>${esc(s.name)}</span><b style="margin:0">${N(s.values[i])}</b></div>`).join("");
    tip.innerHTML = `<b>${esc(spec.tipFmt ? spec.tipFmt(spec.labels[i]) : spec.labels[i])}</b>${rows}${spec.marks && spec.marks[i] ? `<div class="small">${esc(spec.markLabel || "")}</div>` : ""}`;
    tip.style.opacity = 1;
    const tx = Math.min(innerWidth - tip.offsetWidth - 8, e.clientX + 14); tip.style.left = tx + "px"; tip.style.top = (e.clientY - 10 - tip.offsetHeight) + "px";
  };
  svg.onmouseleave = () => { tip.style.opacity = 0; hair.setAttribute("visibility", "hidden"); };
}
function legend(items) { return `<div class="legend">${items.map(([name, color, kind]) => `<span><i class="${kind || ""}" style="${kind === "dash" ? `color:${color}` : `background:${color}`}"></i>${esc(name)}</span>`).join("")}</div>`; }
function rerenderCharts() { for (let i = charts.length - 1; i >= 0; i--) { if (!document.body.contains(charts[i].el)) charts.splice(i, 1); else draw(charts[i]); } }
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(rerenderCharts, 120); });

/* ---------- risks ---------- */
let riskSel = "deficit", riskMore = false;
const RISK_MAIN = ["deficit", "po", "excess", "review_price"];
const S = D.meta.settings;
const RISKS = {
  deficit: ["Не успеем довезти", "Эти товары закончатся раньше, чем придёт заказ, размещённый сегодня. Если заказ уже в пути — товара не будет до его прихода. Обычной поставкой не спасти: попросите поставщика ускорить отгрузку, ищите быструю поставку (авиа, местный поставщик) или договоритесь о частичной отгрузке.", L_.deficit, ["lost_units", "cover_until", "gap_until"]],
  review_price: ["Пересмотреть цену", `Наценка ниже ${N(S.min_markup_pct)}%. В файлы заказов эти товары не попадают — сначала решите, поднимать ли цену или выводить товар.`, L_.review_price, ["markup", "qty"]],
  need_supplier: ["Нужен поставщик", "Пора заказывать, но у товара не указан поставщик. Назначьте поставщика в учётной системе.", L_.need_supplier, ["qty", "cover_until"]],
  rare: ["Редкий спрос", `Продаются реже ${N(S.rare_per_year)} шт. в год. Держать запас невыгодно — заказывайте под конкретного клиента.`, L_.rare, ["demand_12m"]],
  excess: ["Избыток", `Запаса больше чем на ${N(S.excess_months)} мес. Новых заказов не нужно; часть можно распродать.`, L_.excess, ["excess_qty", "demand_12m"]],
  dead: ["Мёртвый остаток", "Продаж не было больше 12 месяцев, но товар лежит на складе. Кандидаты на распродажу или возврат поставщику.", L_.dead, []],
  po: ["Заказы в пути под вопросом", `Заказы, которые опаздывают или просрочены больше чем на ${N(S.doubtful_overdue_days)} дн. Сильно просроченные в расчёте не учитываются — уточните у поставщика.`, D.open_po.filter(o => o.state !== "в пути"), null],
};
const COLS = { qty: ["К заказу, шт.", r => N(r.qty)], lost_units: ["Упустим, шт.", r => N(r.lost_units)], cover_until: ["Хватит до", r => rdShort(r.cover_until)], gap_until: ["Заказ в пути придёт", r => r.gap_until ? rdShort(r.gap_until) : "—"],
  markup: ["Наценка", r => r.markup == null ? "—" : N(r.markup) + "%"], demand_12m: ["Спрос за год", r => N(r.demand_12m)], excess_qty: ["Лишнее, шт.", r => N(r.excess_qty)] };
RENDER.risks = p => {
  const [title, lead, rows, cols] = RISKS[riskSel];

  const keys = Object.keys(RISKS).filter(k => more || RISK_MAIN.includes(k)).sort((a, b) => (RISK_MAIN.indexOf(a) + 1 || 9) - (RISK_MAIN.indexOf(b) + 1 || 9));
  const restN = Object.keys(RISKS).filter(k => !RISK_MAIN.includes(k)).reduce((s, k) => s + RISKS[k][2].length, 0);
  p.innerHTML = `<div class="seg" role="group" aria-label="Список рисков">${keys.map(k => { const v = RISKS[k]; return `<button type="button" data-r="${k}" aria-pressed="${k === riskSel}">${esc(v[0])} <span class="num">${N(v[2].length)}</span></button>`; }).join("")}
    ${more ? "" : `<button type="button" class="more" data-rmore="1" aria-expanded="false">Ещё 3 списка <span class="num">${N(restN)}</span></button>`}</div>

    ${rows.map(r => `<tr class="click" data-sku="${esc(r.sku_id)}"><td><button class="linkbtn sku" type="button">${esc(r.sku_id)}</button></td><td>${esc(r.category_name)}</td><td class="id">${esc(r.supplier_id || "—")}</td><td class="n">${N(r.on_hand)}</td><td class="n">${N(r.pipeline)}</td>${cols.map(c => `<td class="n">${COLS[c][1](r)}</td>`).join("")}<td><div class="why">${esc(r.reason)}</div></td></tr>`).join("")}
  </tbody></table></div>` : `<div class="tbl-wrap" tabindex="0" role="region" aria-label="Таблица"><table><thead><tr><th>Заказ</th><th>Артикул</th><th>Поставщик</th><th>Заказан</th><th>Обещали к</th><th class="n">Ждём, шт.</th><th>Состояние</th></tr></thead><tbody>
    ${rows.sort((a, b) => b.overdue_days - a.overdue_days).map(o => `<tr class="click" data-sku="${esc(o.sku_id)}"><td>${esc(o.po_id)}</td><td><button class="linkbtn sku" type="button">${esc(o.sku_id)}</button></td><td>${esc(o.supplier_id)}</td><td>${rdShort(o.order_date)}</td><td>${rdShort(o.promised)}</td><td class="n">${N(o.qty)}</td>
      <td>${o.state === "сомнительный" ? `<span class="st critical">${ic("alert")}просрочен на ${N(o.overdue_days)} дн. — не учтён</span>` : `<span class="st warning">${ic("clock")}опаздывает на ${N(o.overdue_days)} дн.</span>`}</td></tr>`).join("")}
  </tbody></table></div>`}`;

function allTable() {
  const f = allFilter;
  let rows = D.skus.filter(r => (f.st ? r.status === f.st : r.status !== "INACTIVE")
    && (!f.cat || r.category_name === f.cat) && (!f.oos || r.out_of_stock)
    && (!f.q || r.sku_id.toLowerCase().includes(f.q) || (r.supplier_id || "").toLowerCase().includes(f.q)));
  const k = f.sort;
  rows = rows.slice().sort((a, b) => { let x = a[k], y = b[k]; if (k === "status") { x = a.priority; y = b.priority; }
    if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * f.dir || (b.qty - a.qty); });
  $("#f-count").textContent = `Показано: ${tov(rows.length)}${f.st ? "" : " (без тех, что не продаются)"}`;
  const max = 300;
  $("#all-tbl").innerHTML = rows.length ? `<div class="tbl-wrap" tabindex="0" role="region" aria-label="Таблица" style="max-height:70vh"><table><thead><tr>${ALL_COLS.map(([key, t, num]) => `<th class="sortable ${num ? "n" : ""}" data-k="${key}" ${f.sort === key ? `aria-sort="${f.dir > 0 ? "ascending" : "descending"}"` : ""} tabindex="0">${t}</th>`).join("")}</tr></thead><tbody>
    ${rows.slice(0, max).map(r => `<tr class="click ${r.deficit ? "warn" : ""}" data-sku="${esc(r.sku_id)}"><td><button class="linkbtn sku" type="button">${esc(r.sku_id)}</button></td><td>${chip(r.status)}</td><td>${esc(r.category_name)}</td><td>${esc(r.supplier_id || "—")}</td>
      <td class="n">${N(r.on_hand)}</td><td class="n">${N(r.pipeline)}</td><td class="n">${N(r.demand_3m)}</td><td style="white-space:nowrap">${r.level > 0 ? (r.cover_until ? rdShort(r.cover_until) : "больше 1,5 лет") : "—"}</td><td style="white-space:nowrap">${r.order_date ? rdShort(r.order_date) : "—"}</td><td class="n num">${r.qty ? N(r.qty) : "—"}</td></tr>`).join("")}
  </tbody></table></div>${rows.length > max ? `<p class="small muted">Показаны первые ${max}. Уточните поиск или фильтр.</p>` : ""}` : `<div class="empty-state">Ничего не найдено. Проверьте артикул или сбросьте фильтры.</div>`;
  document.querySelectorAll("#all-tbl th.sortable").forEach(th => { const go = () => { if (f.sort === th.dataset.k) f.dir *= -1; else { f.sort = th.dataset.k; f.dir = th.classList.contains("n") ? -1 : 1; } allTable(); };
    th.onclick = go; th.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } }; });
}

  <h4>2. Сколько будут покупать</h4><p>Смотрим продажи за последние годы. Месяцы, когда товара не было на складе, не считаем — иначе получится, что товар никому не нужен. Учитываем сезон каждой категории (обогреватели — осень, триммеры — весна) и тренд год к году, но осторожно.</p>

  <h4>6. Комментарий аналитика</h4><p>Короткий текст сверху пишет сервис, выбранный при первом запуске (Claude, ChatGPT, DeepSeek, YandexGPT, GigaChat или программа на этом компьютере), или сама программа по шаблону. Цифры для него берутся только из расчёта, и каждое число в тексте автоматически сверяется с расчётом: если сервис ошибся или не ответил, текст собирается по шаблону.</p>

        () => { throw new Error(NO_LINK); });
const DAYS = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"], DAYS_T = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

const hm2 = d => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
const dayDiff = d => { const a = new Date(d); a.setHours(0, 0, 0, 0); return Math.round((a - today0) / 864e5); };
function when(iso) { const d = new Date(iso); if (isNaN(d)) return "—"; const k = dayDiff(d); return (k === 0 ? "сегодня" : k === -1 ? "вчера" : `${d.getDate()} ${MG[d.getMonth()]}`) + " в " + hm2(d); }
function whenNext(d) { if (!d) return "—"; const k = dayDiff(d); return (k === 0 ? "сегодня" : k === 1 ? "завтра" : `в ${DAYS_ACC[(d.getDay() + 6) % 7]}, ${d.getDate()} ${MG[d.getMonth()]},`) + " в " + hm2(d); }
function nextRun(sch) {

    : f.kind === "date" ? `<input type="text" ${attrs} value="${esc(v)}" placeholder="авто или 2026-08-13" autocomplete="off">`
    : `<input type="number" inputmode="decimal" ${attrs} value="${esc(v)}" min="${f.min}" max="${f.max}" step="${f.step}">${f.unit ? `<span>${esc(f.unit)}</span>` : ""}`;
  return `<div class="field ${f.kind === "select" || f.kind === "date" ? "wide" : ""} ${v !== d ? "changed" : ""}" data-def="${esc(d)}" data-dtxt="${esc(dTxt)}">
    <label for="${id}">${esc(f.label)}</label>${f.help ? `<p class="help">${esc(f.help)}</p>` : ""}
    <div class="inp"><div class="ibox">${input}</div><span class="dflt">${dfltTxt(v, d, dTxt)}</span></div></div>`;
}
const dfltTxt = (v, d, dTxt) => v !== d ? `стандартно ${esc(dTxt)} · <button type="button" data-def-btn>вернуть</button>` : "";
function secSettings(m, gh) {
  const S_ = CTL.st.settings; if (!S_) return "";
  const main = S_.fields.filter(f => f.level === "main"), extra = S_.fields.filter(f => f.level === "extra"), cats = Object.entries(S_.categories || {});
  const grouped = list => { const g = {}; list.forEach(f => (g[f.group] = g[f.group] || []).push(f)); return Object.entries(g).map(([name, fs]) => `<h4>${esc(name)}</h4>${fs.map(fieldHtml).join("")}`).join(""); };
  const nx = extra.length + (cats.length ? 1 : 0);
  return `<section class="ctl-sec" id="cs-set" aria-labelledby="cs-set-h"><h3 id="cs-set-h">Правила расчёта</h3>
    <p class="lead">Главное, что влияет на заказы. После сохранения всё пересчитается за несколько секунд.</p>
    <fieldset class="ro" id="set-fs" ${m !== "local" ? "disabled" : ""}>${grouped(main)}
      <details class="adv"><summary>Для специалиста — ещё ${nx} ${plural(nx, "настройка", "настройки", "настроек")}</summary>
        <p class="lead">Тонкая настройка прогноза и сроков. Если не уверены — оставьте как есть: стандартные значения подобраны по истории продаж.</p>
        ${grouped(extra)}
        ${cats.length ? `<h4>Названия категорий</h4>${cats.map(([code, name], i) => `<div class="field"><label for="cat-${i}">${esc(name)}</label><p class="help">Как категория называется на страницах и в файлах заказов.</p><div class="inp"><div class="ibox"><input type="text" id="cat-${i}" data-cat="${esc(code)}" value="${esc(name)}" maxlength="60"></div></div></div>`).join("")}` : ""}
      </details></fieldset>
    ${m !== "local" && gh ? `<p style="margin-top:16px"><a class="btn ghost" href="${gh.edit}" target="_blank" rel="noopener">${ic("ext")}Изменить на GitHub</a></p>` : ""}
    ${m === "local" ? `<p style="margin-top:16px"><button class="linkbtn" type="button" id="set-reset">Вернуть все стандартные значения</button></p>` : ""}
  </section>`;
}

function secHolidays(m, gh) {
  const H_ = CTL.st.holidays; if (!H_) return "";
  const C = H_.countries || {}, list = H_.country_list || [], ro = m !== "local", today = new Date().toISOString().slice(0, 10);
  const opt = (sel, extra) => (extra ? `<option value="">${esc(extra)}</option>` : "") + list.map(c => `<option value="${esc(c)}" ${c === sel ? "selected" : ""}>${esc(c)}</option>`).join("");
  const sups = (D.suppliers || []).filter(s => s.supply_type !== "unknown");
  const own = sups.filter(s => C[s.supplier_id]).length;
  const hol = H_.holidays.map((h, i) => {
    const next = h.dates.find(d => d >= today);
    return `<div class="field hol" data-hol="${esc(h.name)}">
      <div><button class="sw" type="button" role="switch" data-hol-on aria-checked="${h.on}"><i aria-hidden="true"></i>${esc(h.name)}</button>
        <p class="help">${esc(h.countries.join(", "))}${next ? ` · ближайший — ${rd(next)}` : " · дат на будущее нет — добавьте в файл настроек"}. ${esc(h.note || "")}</p></div>
      <div class="inp"><div class="ibox"><span>за</span><input type="number" inputmode="numeric" min="0" max="60" step="1" value="${h.before}" data-hol-before aria-label="${esc(h.name)}: дней простоя до праздника"><span>дн. до</span></div>
        <div class="ibox"><input type="number" inputmode="numeric" min="0" max="90" step="1" value="${h.after}" data-hol-after aria-label="${esc(h.name)}: дней простоя с праздника"><span>дн. с праздника</span></div></div></div>`;
  }).join("");
  return `<section class="ctl-sec" id="cs-hol" aria-labelledby="cs-hol-h"><h3 id="cs-hol-h">Праздники у поставщиков</h3>
    <p class="lead">Пока фабрики стоят, заказ не производится. Если праздник попадает между заказом и приходом, срок поставки удлиняется на дни простоя, и заказывать нужно раньше.</p>
    <fieldset class="ro" id="hol-fs" ${ro ? "disabled" : ""}>
      <h4>Чьи праздники учитывать</h4>
      <div class="field wide"><label for="hc-imp">Импортные поставщики</label><div class="inp"><div class="ibox"><select id="hc-imp" data-cty="импорт">${opt(C["импорт"])}</select></div></div></div>
      <div class="field wide"><label for="hc-loc">Местные поставщики</label><div class="inp"><div class="ibox"><select id="hc-loc" data-cty="местный">${opt(C["местный"])}</select></div></div></div>
      ${sups.length ? `<details class="adv"><summary>Страна отдельного поставщика${own ? ` — задано у ${own}` : ""}</summary>
        <p class="lead">Если поставщик не из Китая (например, из Индии или Вьетнама), выберите его страну. Остальные — как у всех своего типа.</p>
        ${sups.map((s, i) => `<div class="field"><label for="hs-${i}">${esc(s.supplier_id)}</label><p class="help">${s.supply_type === "local" ? "местный" : "импорт"}</p>
          <div class="inp"><div class="ibox"><select id="hs-${i}" data-cty="${esc(s.supplier_id)}" data-orig="${esc(C[s.supplier_id] || "")}">${opt(C[s.supplier_id], "как у всех " + (s.supply_type === "local" ? "местных" : "импортных"))}</select></div></div></div>`).join("")}
      </details>` : ""}
      <h4>Праздники и простой фабрик</h4>${hol}
    </fieldset>
    ${m === "local" ? `<p class="small muted" style="max-width:62ch">Даты праздников по лунному календарю меняются каждый год — они записаны в файле настроек до 2030 года. Сверяйте с поставщиком.</p>
      <div class="btnrow"><button class="btn" type="button" id="hol-save">Сохранить и пересчитать</button><span class="msg" id="hol-msg" role="status"></span></div>`
      : gh ? `<p><a class="btn ghost" href="${gh.edit}" target="_blank" rel="noopener">${ic("ext")}Изменить на GitHub</a></p><p class="small muted">Разделы «страна поставщика» и «праздник …» в файле настроек.</p>` : ""}
  </section>`;
}

function secHistory() {
  const runs = CTL.st.runs || [];
  return `<section class="ctl-sec" id="cs-hist" aria-labelledby="cs-hist-h"><h3 id="cs-hist-h">История обновлений</h3>
  ${runs.length ? `<div class="tbl-wrap" tabindex="0" role="region" aria-label="История обновлений"><table><thead><tr><th>Когда</th><th>Как</th><th>Данные на</th><th>Результат</th><th class="n">Заказать, поз.</th><th class="n">Штук</th></tr></thead><tbody>
    ${runs.map(r => `<tr><td style="white-space:nowrap">${when(r.finished)}</td><td>${esc(r.trigger_label || "")}</td><td style="white-space:nowrap">${r.as_of ? rdShort(r.as_of) : "—"}</td>
      <td>${r.ok ? `<span class="st good">${ic("check")}успешно</span>${r.export ? `<div class="small muted">${esc(r.export)}</div>` : ""}` : `<span class="st serious">${ic("alert")}ошибка</span><div class="small">${esc(r.error)}</div>`}</td>
      <td class="n">${r.counts ? N(r.counts.skus) : "—"}</td><td class="n">${r.counts ? N(r.counts.qty) : "—"}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="empty-state">Пока пусто. Здесь появится каждое обновление: когда, кто запустил и чем закончилось.</div>`}</section>`;
}

/* ход пересчёта */
let polling = false;
function renderJob() {
  renderHead();
  const j = CTL.job, box = $("#job", ctl), msg = $("#save-msg", ctl), rb = $("#run-now", ctl), running = !!(j && j.running);
  if (rb) { rb.disabled = running; rb.innerHTML = `${ic("refresh")}${running ? "Обновляется…" : "Обновить сейчас"}`; }
  ["#run-last", "#ik-err", "#accept-partial"].forEach(s => { const el = $(s, ctl); if (el) (s === "#accept-partial" ? el.parentElement : el).hidden = running; });
  // после неудачи ошибка уже показана в строке о прошлом обновлении — журнал не дублирует её
  if (box && j && !running && !j.ok) box.innerHTML = "";
  else if (box && j && (running || j.ok != null)) box.innerHTML = `<div class="log" role="log">${esc((j.lines || []).join("\n") || "Запускаю…")}</div>${!running && j.ok ? `<p class="okmsg">Готово. Обновляю страницу…</p>` : ""}`;
  if (msg && j && (running || j.ok != null)) { msg.className = "msg" + (!running && !j.ok ? " bad" : ""); msg.textContent = running ? "Пересчитываю…" : j.ok ? "Готово. Обновляю страницу…" : "Пересчёт не удался — подробности в разделе «Обновление»."; }
}
function poll() {
  if (polling) return; polling = true;
  const tick = () => api("/api/run").then(j => { CTL.job = j; renderJob(); if (j.running) setTimeout(tick, 700); else { polling = false; j.ok ? setTimeout(() => location.reload(), 800) : refreshState(); } })
    .catch(() => { polling = false; });
  tick();
}
function refreshState() { return api("/api/state").then(j => { CTL.st = j.control; CTL.job = j.job; renderHead(); if (ctl.open) renderCtl(); }); }
function startedJob(j) { CTL.job = j.job || { running: true, lines: [] }; if (j.control) CTL.st = j.control; renderJob(); poll(); }

function bindCtl() {
  const on = (sel, fn) => { const el = $(sel, ctl); if (el) el.onclick = fn; };
  on(".close", () => ctl.close());
  on("#accept-partial", () => api("/api/intake/accept", {}).then(startedJob).catch(e => { $("#src-msg", ctl).className = "msg bad"; $("#src-msg", ctl).textContent = e.message; }));
  on("#run-now", () => api("/api/run", {}).then(startedJob).catch(e => { $("#job", ctl).innerHTML = `<div class="err" role="alert">${esc(e.message)}</div>`; }));
  ctl.querySelectorAll("[data-open]").forEach(b => b.onclick = () => api("/api/open", { what: b.dataset.open }).catch(e => alert(e.message)));
  // данные
  const srcMsg = t => { const m = $("#src-msg", ctl); if (m) m.textContent = t; };
  on("#pick-folder", () => { srcMsg("Откроется окно выбора папки — оно может появиться за браузером."); api("/api/source/pick", {}).then(j => { CTL.st = j.control; renderCtl(); }).catch(e => srcMsg(e.message)); });
  on("#redo-setup", () => { ctl.close(); WD.s = null; SU.prev = null; SU.auto = null; openSetup(); });
  on("#reset-folder", () => api("/api/source", { folder: null }).then(j => { CTL.st = j.control; renderCtl(); }).catch(e => srcMsg(e.message)));
  ctl.querySelectorAll(".mapbox").forEach(box => {
    const sel = $("[data-map-table]", box); sel.onchange = () => mapCols(box); mapCols(box);
    const b = $("[data-map-save]", box); if (!b) return;
    b.onclick = () => {
      const u = CTL.st.intake.unknown[+box.dataset.u], table = sel.value, columns = {};
      const msg = $("[data-map-msg]", box);
      if (!table) { msg.className = "msg bad"; msg.textContent = "Выберите, что в файле."; return; }
      box.querySelectorAll("[data-h]").forEach(s => { if (s.value) columns[s.dataset.h] = s.value; });
      b.disabled = true; msg.className = "msg"; msg.textContent = "Сохраняю…";
      api("/api/mapping", { sig: u.sig, table, columns, recalc: true }).then(startedJob).catch(e => { b.disabled = false; msg.className = "msg bad"; msg.textContent = e.message; });
    };
  });
  // расписание
  const sw = $("#sch-on", ctl);
  if (sw) {
    sw.onclick = () => { sw.setAttribute("aria-checked", sw.getAttribute("aria-checked") !== "true"); updSum(); };
    $("#sch-time", ctl).oninput = updSum;
    ctl.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); updSum(); });
    ctl.querySelectorAll("[data-days]").forEach(b => b.onclick = () => { const set = b.dataset.days === "all" ? DAYS : DAYS.slice(0, 5); ctl.querySelectorAll("[data-day]").forEach(x => x.setAttribute("aria-pressed", set.includes(x.dataset.day))); updSum(); });
    updSum();
  }
  on("#sch-save", () => {
    const m = $("#sch-msg", ctl), b = $("#sch-save", ctl); b.disabled = true; m.className = "msg"; m.textContent = "Сохраняю…";
    api("/api/schedule", schDraft()).then(j => { CTL.st = j.control; renderCtl(); const m2 = $("#sch-msg", ctl); if (m2) { m2.className = "okmsg"; m2.textContent = "Сохранено."; } })
      .catch(e => { b.disabled = false; m.className = "msg bad"; m.textContent = e.message; });
  });
  // праздники
  ctl.querySelectorAll("[data-hol-on]").forEach(b => b.onclick = () => b.setAttribute("aria-checked", b.getAttribute("aria-checked") !== "true"));
  on("#hol-save", () => {
    const m = $("#hol-msg", ctl), b = $("#hol-save", ctl), countries = {};
    const holidays = [...ctl.querySelectorAll("[data-hol]")].map(f => ({ name: f.dataset.hol, on: $("[data-hol-on]", f).getAttribute("aria-checked") === "true",
      before: $("[data-hol-before]", f).value, after: $("[data-hol-after]", f).value }));
    ctl.querySelectorAll("[data-cty]").forEach(s => { if (s.dataset.orig == null || s.value !== s.dataset.orig) countries[s.dataset.cty] = s.value; });
    b.disabled = true; m.className = "msg"; m.textContent = "Сохраняю…";
    api("/api/holidays", { holidays, countries, recalc: true }).then(startedJob).catch(e => { b.disabled = false; m.className = "msg bad"; m.textContent = e.message; });
  });
  // правила расчёта
  const fs = $("#set-fs", ctl), bar = $("#ctl-save", ctl);
  if (fs && bar) {
    const dirty = () => [...ctl.querySelectorAll("[data-fid]")].some(el => el.value !== el.dataset.orig) || [...ctl.querySelectorAll("[data-cat]")].some(el => el.value !== el.defaultValue);
    const upd = el => { const f = el.closest(".field"); if (f && f.dataset.def != null && el.dataset.fid) { const ch = el.value !== f.dataset.def; f.classList.toggle("changed", ch); $(".dflt", f).innerHTML = dfltTxt(el.value, f.dataset.def, f.dataset.dtxt); } bar.hidden = !dirty(); };
    fs.addEventListener("input", e => upd(e.target));
    fs.addEventListener("change", e => upd(e.target));
    fs.addEventListener("click", e => { const b = e.target.closest("[data-def-btn]"); if (!b) return; const f = b.closest(".field"), el = $("[data-fid]", f); el.value = f.dataset.def; upd(el); el.focus(); });
    on("#set-cancel", () => { ctl.querySelectorAll("[data-fid]").forEach(el => { el.value = el.dataset.orig; upd(el); }); ctl.querySelectorAll("[data-cat]").forEach(el => { el.value = el.defaultValue; }); bar.hidden = true; });
    on("#set-save", () => {
      const msg = $("#save-msg", ctl), values = {}, categories = {};
      for (const el of ctl.querySelectorAll("[data-fid]")) {
        if (el.validity && el.validity.badInput) { msg.className = "msg bad"; msg.textContent = `«${el.closest(".field").querySelector("label").textContent}»: нужно число.`; el.focus(); return; }
        if (el.value !== el.dataset.orig) values[el.dataset.fid] = el.value;
      }
      ctl.querySelectorAll("[data-cat]").forEach(el => { if (el.value !== el.defaultValue) categories[el.dataset.cat] = el.value; });
      $("#set-save", ctl).disabled = true; msg.className = "msg"; msg.textContent = "Сохраняю…";
      api("/api/settings", { values, categories, recalc: true }).then(startedJob)
        .catch(e => { $("#set-save", ctl).disabled = false; msg.className = "msg bad"; msg.textContent = e.message; });
    });
    let armed = 0;
    on("#set-reset", () => {
      const b = $("#set-reset", ctl);
      if (Date.now() - armed > 4000) { armed = Date.now(); b.textContent = "Точно вернуть все стандартные? Нажмите ещё раз"; setTimeout(() => { if (b.isConnected) b.textContent = "Вернуть все стандартные значения"; }, 4000); return; }
      api("/api/settings/reset", { recalc: true }).then(startedJob).catch(e => { b.textContent = e.message; });
    });
  }
}

function mergeSent(server) { if (!server) return; sent = { ...server }; try { localStorage.setItem(SENT_KEY, JSON.stringify(sent)); } catch (e) {} renderSuppliers(supAll); }
renderHead();
if (/^(127\.0\.0\.1|localhost)$/.test(location.hostname)) {
  api("/api/state").then(j => { CTL.mode = "local"; CTL.st = j.control; CTL.job = j.job; renderHead(); mergeSent(j.control.sent); if (j.job && j.job.running) poll();
    else if (j.control.setup && !j.control.setup.done) { const sb = $("#stale-bar"); if (sb) sb.hidden = true; openSetup(); } }).catch(() => {});
}

showTab((location.hash || "#calendar").slice(1), false);
addEventListener("hashchange", () => showTab(location.hash.slice(1), true));
})();
</script>
</body>
</html>
